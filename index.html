<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">ShopLocal</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
        </nav>
        <div class="cart-icon-container" id="cart-icon-btn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Discover Handcrafted Goods</h1>
        <p>Explore curated essentials designed for everyday comfort.</p>
    </section>

    <!-- Product Grid -->
    <main class="product-container" id="product-list">
        <!-- Products will be loaded dynamically via JavaScript -->
    </main>

    <!-- Cart Sidebar Drawer -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items loaded here -->
        </div>
        <div class="cart-total-section">
            <h3>Total: $<span id="cart-total">0.00</span></h3>
            <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ShopLocal. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
