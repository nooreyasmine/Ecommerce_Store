<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ShopLocal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">ShopLocal</a>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
        </nav>
        <div class="header-icons">
            <div class="cart-icon-container" id="cart-icon-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div>
                <h1>Hello, <span id="user-display-name">Guest</span>!</h1>
                <p>Manage your orders and saved wishlist items below.</p>
            </div>
            <button class="auth-btn" onclick="logoutUser()" style="margin-top:0;">Log Out</button>
        </div>

        <div class="profile-grid">
            <!-- Order History Panel -->
            <div class="section-card">
                <h2>My Order History</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date Ordered</th>
                                <th>Items Count</th>
                                <th>Total Cost</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="order-history-rows">
                            <!-- Injected order history -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Saved Wishlist Panel -->
            <div class="section-card">
                <h2>My Wishlist Items</h2>
                <div class="product-container" id="wishlist-grid" style="margin: 0; padding: 0;">
                    <!-- Injected saved products -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Drawer logic wrapper to prevent load exceptions -->
    <div class="cart-sidebar" id="cart-sidebar" style="display:none;"><button id="close-cart-btn"></button><div id="cart-items"></div><span id="cart-total"></span><button id="checkout-btn"></button></div>

    <footer>
        <p>&copy; 2026 ShopLocal. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
